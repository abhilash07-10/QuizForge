<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — QuizForge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%233454D1%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>(function(){ var t = localStorage.getItem('quizforge_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); })();</script>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .profile-header-card { padding: var(--space-8); display: flex; align-items: center; gap: var(--space-6); flex-wrap: wrap; }
  .profile-avatar-lg { width: 72px; height: 72px; border-radius: 50%; background: var(--accent-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: var(--fs-xl); flex-shrink: 0; }
  .profile-header-info h1 { margin-bottom: 4px; }
  .profile-header-info .joined { font-size: var(--fs-sm); color: var(--text-tertiary); }
  .profile-edit-btn { margin-left: auto; }
  @media (max-width: 600px) { .profile-edit-btn { margin-left: 0; } }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header-root"></div>

<main id="main" class="page-main">
  <div class="container" style="max-width: 900px;">

    <div class="card profile-header-card" id="profile-header-card">
      <div class="skeleton skeleton-line" style="width: 100%; height: 60px;"></div>
    </div>

    <div class="grid" style="grid-template-columns: repeat(3, 1fr); margin: var(--space-8) 0;" id="profile-stats"></div>

    <div class="grid" style="grid-template-columns: 1fr 1fr; align-items: start;">
      <div>
        <div class="page-header"><h2 style="font-size: var(--fs-xl);">Category Strengths</h2></div>
        <div class="card card-padded" id="profile-category-card"></div>
      </div>
      <div>
        <div class="page-header"><h2 style="font-size: var(--fs-xl);">Achievements</h2></div>
        <div class="grid" style="grid-template-columns: repeat(3, 1fr);" id="profile-achievements-grid"></div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer-root"></div>

<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/toast.js"></script>
<script src="js/modal.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
