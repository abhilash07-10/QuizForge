<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — QuizForge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%233454D1%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>(function(){ var t = localStorage.getItem('quizforge_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); })();</script>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header-root"></div>

<main id="main" class="auth-shell">
  <div class="card auth-card">
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to continue where you left off.</p>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" name="email" autocomplete="email" required>
        <div class="form-error" id="err-email" hidden></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" required>
          <button type="button" class="input-icon-btn" id="toggle-password" aria-label="Show password">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="form-error" id="err-password" hidden></div>
      </div>

      <div class="form-group flex items-center justify-between" style="margin-bottom: var(--space-6);">
        <label class="checkbox-row" style="margin-bottom:0;">
          <input type="checkbox" id="remember">
          <span>Remember me</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Log in</button>
    </form>

    <div class="auth-switch">Don't have an account? <a href="register.html">Sign up</a></div>
  </div>
</main>

<div id="site-footer-root"></div>

<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/toast.js"></script>
<script src="js/modal.js"></script>
<script src="js/nav.js"></script>
<script src="js/login.js"></script>
</body>
</html>
