<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results — QuizForge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%233454D1%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>(function(){ var t = localStorage.getItem('quizforge_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); })();</script>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .results-hero { text-align: center; padding: var(--space-10) var(--space-6); }
  .results-hero .emoji { font-size: 2.5rem; margin-bottom: var(--space-2); }
  .results-score-row { display: flex; justify-content: center; gap: var(--space-10); flex-wrap: wrap; margin: var(--space-8) 0; }
  .result-stat { text-align: center; }
  .result-stat .num { font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-2xl); display: block; }
  .result-stat.correct .num { color: var(--color-success-500); }
  .result-stat.wrong .num { color: var(--color-danger-500); }
  .result-stat.skipped .num { color: var(--text-tertiary); }
  .result-stat .lbl { font-size: var(--fs-xs); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; }
  .perf-message { max-width: 480px; margin: 0 auto var(--space-8); font-size: var(--fs-md); color: var(--text-primary); font-weight: 500; }
  .result-actions { display: flex; gap: var(--space-3); justify-content: center; flex-wrap: wrap; }
  .new-achievements { display: flex; gap: var(--space-4); justify-content: center; flex-wrap: wrap; margin: var(--space-6) 0; }
  .new-achievement-chip { display: flex; align-items: center; gap: var(--space-2); background: var(--bg-surface-muted); border-radius: var(--radius-full); padding: 0.5em 1em 0.5em 0.5em; font-size: var(--fs-sm); font-weight: 600; }
  .new-achievement-chip .ic { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--color-ember-400), var(--color-ember-600)); color: #fff; display: flex; align-items: center; justify-content: center; }
  .review-question-block { padding: var(--space-6); margin-bottom: var(--space-5); }
  .review-question-block .qnum { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-tertiary); margin-bottom: var(--space-2); display: block; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header-root"></div>

<main id="main" class="page-main">
  <div class="container" style="max-width: 780px;">

    <div class="card" id="results-summary-card">
      <div class="skeleton skeleton-card" style="height: 420px;"></div>
    </div>

    <div style="margin-top: var(--space-10);">
      <div class="tabs" id="review-tabs" hidden>
        <button class="tab-btn active" data-tab="review">Review Answers</button>
      </div>
      <div id="review-content"></div>
    </div>

  </div>
</main>

<div id="site-footer-root"></div>

<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/toast.js"></script>
<script src="js/modal.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/results.js"></script>
</body>
</html>
