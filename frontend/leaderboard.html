<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — QuizForge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%233454D1%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>(function(){ var t = localStorage.getItem('quizforge_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); })();</script>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; font-weight: 700; font-family: var(--font-mono); font-size: var(--fs-sm); }
  .rank-badge.gold { background: #FCEBC0; color: #9A6A00; }
  .rank-badge.silver { background: #E6E9F0; color: #5B6478; }
  .rank-badge.bronze { background: #F3DCC6; color: #93502A; }
  [data-theme="dark"] .rank-badge.gold { background: #4A3B10; color: #FCEBC0; }
  [data-theme="dark"] .rank-badge.silver { background: #333B4E; color: #E6E9F0; }
  [data-theme="dark"] .rank-badge.bronze { background: #4A3320; color: #F3DCC6; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header-root"></div>

<main id="main" class="page-main">
  <div class="container" style="max-width: 900px;">
    <div class="page-header">
      <span class="page-eyebrow">Leaderboard</span>
      <h1 class="page-title">Leaderboard</h1>
      <p class="page-subtitle">See how your practice stacks up — ranked by XP earned from completed quizzes.</p>
    </div>

    <div class="tabs" id="period-tabs">
      <button class="tab-btn active" data-period="weekly">Weekly</button>
      <button class="tab-btn" data-period="monthly">Monthly</button>
      <button class="tab-btn" data-period="all_time">All Time</button>
    </div>

    <div class="card" id="leaderboard-card">
      <div style="padding: var(--space-6);">
        <div class="skeleton skeleton-line" style="width:100%;"></div>
        <div class="skeleton skeleton-line" style="width:90%;"></div>
        <div class="skeleton skeleton-line" style="width:95%;"></div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer-root"></div>

<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/toast.js"></script>
<script src="js/modal.js"></script>
<script src="js/nav.js"></script>
<script src="js/leaderboard.js"></script>
</body>
</html>
