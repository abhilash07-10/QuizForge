<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taking Quiz — QuizForge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%233454D1%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>(function(){ var t = localStorage.getItem('quizforge_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); })();</script>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div id="site-header-root"></div>

<div class="quiz-shell" id="quiz-shell">
  <div class="quiz-topbar">
    <div class="container quiz-topbar-inner">
      <div class="quiz-title-block">
        <h2 id="quiz-title">Loading quiz…</h2>
        <span class="q-count" id="q-count"></span>
      </div>
      <div class="quiz-timer" id="quiz-timer">--:--</div>
    </div>
    <div class="container quiz-progress-row">
      <div class="progress-track"><div class="progress-fill" id="quiz-progress-fill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="quiz-body" id="quiz-body">
    <div class="question-panel">
      <div class="card question-card" id="question-card">
        <div class="skeleton skeleton-line" style="width: 30%;"></div>
        <div class="skeleton skeleton-line" style="width: 90%; height: 24px; margin: 16px 0;"></div>
        <div class="skeleton skeleton-line" style="width: 100%; height: 50px;"></div>
        <div class="skeleton skeleton-line" style="width: 100%; height: 50px;"></div>
      </div>
    </div>

    <aside class="quiz-sidebar">
      <div class="card sidebar-card">
        <h4>Summary</h4>
        <div class="summary-count-row"><span>Answered</span><strong id="sum-answered">0</strong></div>
        <div class="summary-count-row"><span>Unanswered</span><strong id="sum-unanswered">0</strong></div>
        <div class="summary-count-row"><span>Marked</span><strong id="sum-marked">0</strong></div>
      </div>
      <div class="card sidebar-card">
        <h4>Question Navigator</h4>
        <div class="nav-legend">
          <span><span class="legend-dot answered"></span>Answered</span>
          <span><span class="legend-dot unanswered"></span>Unanswered</span>
          <span><span class="legend-dot marked"></span>Marked</span>
        </div>
        <div class="question-grid" id="question-nav-grid"></div>
      </div>
      <button class="btn btn-primary btn-block" id="submit-quiz-btn">Submit Quiz</button>
    </aside>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/toast.js"></script>
<script src="js/modal.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/quiz-engine.js"></script>
</body>
</html>
